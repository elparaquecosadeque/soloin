<div class="fretboard-scroll">
  @if (caption()) {
    <p class="caption">{{ caption() }}</p>
  }
  <svg
    #svg
    class="fretboard"
    [class.cropped]="cropped()"
    role="img"
    [attr.aria-label]="ariaLabel()"
    [attr.viewBox]="viewBox()"
  >
    <!-- CAGED box bands -->
    @for (band of bands(); track band.shape + band.x) {
      <rect
        [attr.x]="band.x"
        [attr.y]="band.y"
        [attr.width]="band.width"
        [attr.height]="band.height"
        rx="6"
        [attr.fill]="'var(' + band.colorVar + ')'"
        fill-opacity="0.12"
      />
    }

    <!-- nut -->
    @if (!plain() && hasNut()) {
      <rect [attr.x]="nutX()" [attr.y]="stringY1()" width="6" [attr.height]="stringY2() - stringY1()" fill="var(--_chords-nut)" />
    }

    <!-- fret lines -->
    @for (fl of fretLines(); track fl.x) {
      <line
        [attr.x1]="fl.x"
        [attr.y1]="stringY1()"
        [attr.x2]="fl.x"
        [attr.y2]="stringY2()"
        [attr.stroke]="fl.isNut && !plain() ? 'var(--_chords-nut)' : 'var(--_chords-fret)'"
        [attr.stroke-width]="plain() ? (fl.isNut ? 2 : 1) : fl.isNut ? 4 : 1.5"
      />
    }

    <!-- position markers -->
    @if (!plain()) {
      @for (m of positionMarkers(); track $index) {
        <circle [attr.cx]="m.cx" [attr.cy]="m.cy" r="6" fill="var(--_chords-marker)" />
      }
    }

    <!-- strings -->
    @for (s of strings(); track $index) {
      <line [attr.x1]="nutX()" [attr.y1]="s.y" [attr.x2]="stringLineX2()" [attr.y2]="s.y" stroke="var(--_chords-string)" [attr.stroke-width]="plain() ? 1 : 2" />
      <text
        [attr.x]="stringLabelX()"
        [attr.y]="s.y"
        class="string-label"
        [attr.text-anchor]="plain() ? 'middle' : 'end'"
        dominant-baseline="central"
        [attr.font-family]="fontFamily"
        [attr.font-size]="look().stringSize"
        [attr.font-weight]="look().stringWeight"
        fill="var(--_chords-muted)"
      >{{ s.label }}</text>
    }

    <!-- fret numbers -->
    @for (fn of fretNumbers(); track fn.label) {
      <text
        [attr.x]="fn.x"
        [attr.y]="fretNumY()"
        class="fret-num"
        text-anchor="middle"
        [attr.font-family]="fontFamily"
        [attr.font-size]="look().numSize"
        fill="var(--_chords-muted)"
      >{{ fn.label }}</text>
    }

    @for (band of bands(); track band.shape + band.x) {
      <text
        [attr.x]="band.labelX"
        [attr.y]="fretNumY()"
        class="fret-num"
        text-anchor="middle"
        [attr.font-family]="fontFamily"
        [attr.font-size]="look().numSize"
        font-weight="700"
        fill="var(--_chords-text)"
      >{{ band.shape }}</text>
    }

    <!-- selectable positions -->
    @for (p of selectableDots(); track p.key) {
      <g
        class="position"
        [class.selected]="p.selected"
        role="button"
        tabindex="0"
        [attr.aria-pressed]="p.selected"
        [attr.aria-label]="p.ariaLabel"
        (click)="togglePosition(p.position)"
        (keydown.enter)="togglePosition(p.position)"
        (keydown.space)="$event.preventDefault(); togglePosition(p.position)"
      >
        <circle class="position-hit" [attr.cx]="p.x" [attr.cy]="p.y" [attr.r]="look().hit" fill="transparent" />
        @if (p.selected) {
          <circle [attr.cx]="p.x" [attr.cy]="p.y" [attr.r]="look().ring" fill="none" [attr.stroke]="markColor()" stroke-width="2" />
        } @else if (previewActive() && p.isPreviewRoot) {
          <circle [attr.cx]="p.x" [attr.cy]="p.y" [attr.r]="look().ring" fill="none" stroke="var(--_chords-chord-color-2)" stroke-width="2" />
        }
        @if (!p.selected) {
          <!-- opaque base so the string line doesn't show through the dimmed dot and strike out its label -->
          <circle [attr.cx]="p.x" [attr.cy]="p.y" [attr.r]="look().dot" fill="var(--_chords-background, transparent)" />
        }
        <circle
          class="position-dot"
          [attr.cx]="p.x"
          [attr.cy]="p.y"
          [attr.r]="look().dot"
          [attr.fill]="p.selected ? markColor() : previewActive() && p.inPreview ? 'var(--_chords-chord-color-2)' : 'var(--_chords-scale-note)'"
          [attr.fill-opacity]="p.selected ? 1 : previewActive() ? (p.inPreview ? 1 : 0.15) : 0.4"
        />
        <text
          class="dot-label"
          [attr.x]="p.x"
          [attr.y]="p.y"
          text-anchor="middle"
          dominant-baseline="central"
          [attr.font-family]="fontFamily"
          [attr.font-size]="look().label"
          [attr.font-weight]="look().labelWeight"
          [attr.fill]="p.selected ? markInk() : previewActive() && p.inPreview ? 'var(--_chords-preview-ink, #0b1020)' : 'var(--_chords-text)'"
          [attr.fill-opacity]="!p.selected && previewActive() && !p.inPreview ? 0.35 : 1"
        >{{ p.label }}</text>
      </g>
    }

    <!-- notes -->
    @for (dot of dots(); track dot.x + '-' + dot.y + '-' + dot.colorVar) {
      @if (dot.ring !== null) {
        <circle
          [attr.cx]="dot.x"
          [attr.cy]="dot.y"
          [attr.r]="dot.ring"
          fill="none"
          [attr.stroke]="'var(' + dot.colorVar + ')'"
          stroke-width="2"
        />
      }
      <circle [attr.cx]="dot.x" [attr.cy]="dot.y" [attr.r]="dot.r" [attr.fill]="'var(' + dot.colorVar + ')'" />
      @if (dot.label) {
        <text
          [attr.x]="dot.x"
          [attr.y]="dot.y"
          class="dot-label"
          text-anchor="middle"
          dominant-baseline="central"
          [attr.font-family]="fontFamily"
          [attr.font-size]="look().label"
          [attr.font-weight]="look().labelWeight"
          fill="var(--_chords-on-primary)"
        >{{ dot.label }}</text>
      }
    }

    <!-- user marks (read-only view) -->
    @for (m of marks(); track m.key) {
      <circle [attr.cx]="m.x" [attr.cy]="m.y" [attr.r]="look().markRing" fill="none" [attr.stroke]="markColor()" stroke-width="3" />
      <circle [attr.cx]="m.x" [attr.cy]="m.y" [attr.r]="look().dot" [attr.fill]="markColor()" />
      <text
        [attr.x]="m.x"
        [attr.y]="m.y"
        class="dot-label"
        text-anchor="middle"
        dominant-baseline="central"
        [attr.font-family]="fontFamily"
        [attr.font-size]="look().label"
        [attr.font-weight]="look().labelWeight"
        [attr.fill]="markInk()"
      >{{ m.label }}</text>
    }
  </svg>
</div>
