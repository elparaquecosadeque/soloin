<div class="fretboard-scroll">
  <svg #svg class="fretboard" role="img" [attr.aria-label]="ariaLabel()" [attr.viewBox]="viewBox">
    <!-- nut -->
    <rect [attr.x]="nutX" [attr.y]="stringY1" width="6" [attr.height]="stringY2 - stringY1" fill="var(--_chords-nut)" />

    <!-- fret lines -->
    @for (fl of fretLines; track fl.x) {
      <line
        [attr.x1]="fl.x"
        [attr.y1]="stringY1"
        [attr.x2]="fl.x"
        [attr.y2]="stringY2"
        [attr.stroke]="fl.isNut ? 'var(--_chords-nut)' : 'var(--_chords-fret)'"
        [attr.stroke-width]="fl.isNut ? 4 : 1.5"
      />
    }

    <!-- position markers -->
    @for (m of positionMarkers; track $index) {
      <circle [attr.cx]="m.cx" [attr.cy]="m.cy" r="6" fill="var(--_chords-marker)" />
    }

    <!-- strings -->
    @for (s of strings(); track $index) {
      <line [attr.x1]="nutX" [attr.y1]="s.y" [attr.x2]="stringLineX2" [attr.y2]="s.y" stroke="var(--_chords-string)" stroke-width="2" />
      <text
        [attr.x]="stringLabelX"
        [attr.y]="s.y"
        class="string-label"
        text-anchor="end"
        dominant-baseline="central"
        [attr.font-family]="fontFamily"
        font-size="13"
        font-weight="600"
        fill="var(--_chords-muted)"
      >{{ s.label }}</text>
    }

    <!-- fret numbers -->
    @for (fn of fretNumbers; track fn.label) {
      <text
        [attr.x]="fn.x"
        [attr.y]="fretNumY"
        class="fret-num"
        text-anchor="middle"
        [attr.font-family]="fontFamily"
        font-size="12"
        fill="var(--_chords-muted)"
      >{{ fn.label }}</text>
    }

    <!-- selectable positions -->
    @for (p of selectableDots(); track p.key) {
      <g
        class="position"
        [class.selected]="p.selected"
        role="button"
        tabindex="0"
        [attr.aria-pressed]="p.selected"
        [attr.aria-label]="p.ariaLabel"
        (click)="togglePosition(p.position)"
        (keydown.enter)="togglePosition(p.position)"
        (keydown.space)="$event.preventDefault(); togglePosition(p.position)"
      >
        <circle class="position-hit" [attr.cx]="p.x" [attr.cy]="p.y" r="20" fill="transparent" />
        @if (p.selected) {
          <circle [attr.cx]="p.x" [attr.cy]="p.y" r="17" fill="none" stroke="var(--_chords-chord-color-1)" stroke-width="2" />
        } @else if (previewActive() && p.isPreviewRoot) {
          <circle [attr.cx]="p.x" [attr.cy]="p.y" r="17" fill="none" stroke="var(--_chords-chord-color-2)" stroke-width="2" />
        }
        @if (!p.selected) {
          <!-- opaque base so the string line doesn't show through the dimmed dot and strike out its label -->
          <circle [attr.cx]="p.x" [attr.cy]="p.y" r="13" fill="var(--_chords-background, transparent)" />
        }
        <circle
          class="position-dot"
          [attr.cx]="p.x"
          [attr.cy]="p.y"
          r="13"
          [attr.fill]="p.selected ? 'var(--_chords-chord-color-1)' : previewActive() && p.inPreview ? 'var(--_chords-chord-color-2)' : 'var(--_chords-scale-note)'"
          [attr.fill-opacity]="p.selected ? 1 : previewActive() ? (p.inPreview ? 1 : 0.15) : 0.4"
        />
        <text
          class="dot-label"
          [attr.x]="p.x"
          [attr.y]="p.y"
          text-anchor="middle"
          dominant-baseline="central"
          [attr.font-family]="fontFamily"
          font-size="11"
          font-weight="800"
          [attr.fill]="p.selected ? 'var(--_chords-on-primary)' : previewActive() && p.inPreview ? 'var(--_chords-preview-ink, #0b1020)' : 'var(--_chords-text)'"
          [attr.fill-opacity]="!p.selected && previewActive() && !p.inPreview ? 0.35 : 1"
        >{{ p.label }}</text>
      </g>
    }

    <!-- notes -->
    @for (dot of dots(); track dot.x + '-' + dot.y + '-' + dot.colorVar) {
      @if (dot.isRoot) {
        <circle
          [attr.cx]="dot.x"
          [attr.cy]="dot.y"
          [attr.r]="dot.r + 3"
          fill="none"
          [attr.stroke]="'var(' + dot.colorVar + ')'"
          stroke-width="2"
        />
      }
      <circle [attr.cx]="dot.x" [attr.cy]="dot.y" [attr.r]="dot.r" [attr.fill]="'var(' + dot.colorVar + ')'" />
      @if (dot.label) {
        <text
          [attr.x]="dot.x"
          [attr.y]="dot.y"
          class="dot-label"
          text-anchor="middle"
          dominant-baseline="central"
          [attr.font-family]="fontFamily"
          font-size="11"
          font-weight="800"
          fill="var(--_chords-on-primary)"
        >{{ dot.label }}</text>
      }
    }
  </svg>
</div>
